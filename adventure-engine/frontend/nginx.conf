server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing -- any path that isn't a real
    # file (e.g. /destinations/3) must still fall back to index.html so the
    # app can render the matching route itself.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
