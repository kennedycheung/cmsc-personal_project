services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # SQLite backed by a named volume below -- fine for local/demo use.
      # Point DATABASE_URL at a real Postgres instance for production; no
      # other code changes are needed (see documentation/deployment.md).
      DATABASE_URL: sqlite:////app/data/adventure.db
      SECRET_KEY: ${SECRET_KEY:-change-me}
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend_data:
